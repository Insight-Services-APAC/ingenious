[project]
name = "ingen-prompt-tuner"
version = "0.1.0"
description = "Ingen Prompt Tuner - AI orchestration backend hosting Ingenious agent flows"
requires-python = ">=3.13"
dependencies = [
    "ingenious[ai,azure]>=0.2.8", # Ingenious agent framework with AI/AutoGen and Azure support - listed first to let it set fastapi version
    "uvicorn[standard]>=0.35.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0", # Load .env files
    "azure-cosmos>=4.14.3",
    "jinja2>=3.1.6",
    "urllib3>=2.6.3",  # CVE fix: GHSA-gm62-xv2j-4w53, GHSA-2xpw-w6gg-jr37, GHSA-38jv-5279-wg99
    "filelock>=3.20.1",  # CVE fix: GHSA-w853-jp5j-5j7f
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingen_prompt_tuner"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
]
